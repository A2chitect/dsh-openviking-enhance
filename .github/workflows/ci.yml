# Type check, build, unit tests and both smoke harnesses.
#
# No OpenViking server is required: `scripts/smoke-host.mjs` reports SKIP for the
# live-data path when the server is unreachable and still asserts the route fence,
# which is the part a change in this repository can actually regress. Locally, run
# `SMOKE_REQUIRE_SERVER=1 pnpm run smoke` to make that skip a failure instead.
#
# The DSH UI packages are pinned to the runtime generation (0.2.2-rc.1) on purpose:
# the type check validates our slot names and props against their `SlotMap`
# augmentations, so a range would silently validate against the wrong generation.
name: ci

on:
  # Branch pushes, pull requests, and release tags. A `v*` tag has to pass the same
  # gate the release script ran locally — `pnpm test` includes
  # `test/release-meta.test.mjs`, which fails when the version in package.json and
  # the newest section of CHANGELOG.md disagree.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The major this lockfile was produced with, and the one the desktop app
      # installs plugins with: the build-script policy below (`allowBuilds`) is a
      # pnpm 12 setting, and an older pnpm that does not know it fails the install
      # with ERR_PNPM_IGNORED_BUILDS.
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      # `.npmrc` keeps the store and cache inside the repository for the DSH
      # desktop sandbox; that is harmless here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The one thing `pnpm test` cannot see: that the tarball a user installs
      # actually carries the built bundle the shell serves. `prepack` builds it,
      # so this fails if that hook is ever lost.
      - name: the published tarball is complete
        run: |
          pnpm pack --pack-destination /tmp
          tarball=$(ls /tmp/dsh-openviking-enhance-*.tgz)
          for entry in package/lib/index.js package/lib/client.js package/cordis.patch.yml package/LICENSE package/package.json package/THIRD_PARTY_NOTICES package/PROVENANCE.md; do
            tar tzf "$tarball" | grep -qx "$entry" || { echo "missing from the tarball: $entry"; exit 1; }
          done
          echo "tarball carries the bundle, the patch, the licence and the manifest"

  # Clean-profile install verification (audit P0-2/P0-4, ROADMAP "Every version is
  # verifiable"): the tarball a user installs is actually installed into a scratch
  # DSH_HOME, booted, checked for its composed client bundle and its host route,
  # reinstalled and removed. Pinned to the DSH generation the contract documents;
  # no secrets, no OpenViking dataset, no browser.
  install-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      # The generation with the authenticated `ctx.connection.fetch` transport
      # (the write floor); `engines.dsh` still admits the older read-only ones.
      - name: pin the DSH generation the compatibility matrix documents
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.1
      - name: pack the tarball under test
        run: pnpm pack --pack-destination /tmp
      - name: install, boot, reinstall, uninstall in a scratch DSH home
        run: |
          tarball=$(ls /tmp/dsh-openviking-enhance-*.tgz)
          node scripts/verify-install.mjs --dsh "$(command -v dsh)" --tarball "$tarball" --json-out /tmp/install-verify.json
      # The upgrade leg needs the npm registry for the previously published
      # package; keeping it on tags only means PRs stay hermetic and fast.
      - name: upgrade from the previous published version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tarball=$(ls /tmp/dsh-openviking-enhance-*.tgz)
          node scripts/verify-install.mjs --dsh "$(command -v dsh)" --tarball "$tarball" --upgrade-from dsh-openviking-enhance@0.3.0 --json-out /tmp/install-verify-upgrade.json
      - name: keep the machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-verify
          path: /tmp/install-verify*.json
          if-no-files-found: warn
