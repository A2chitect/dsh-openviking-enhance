# pnpm 10+ refuses to run dependency install scripts until each one is decided,
# and it treats an undecided entry as a failure — so every package that asks for
# one is listed here explicitly.
#
# esbuild's script stages the platform binary this repository's build needs.
# The rest arrive with the DSH packages used for their type declarations; nothing
# here runs them, and approving a harness package's postinstall to build native
# addons this plugin never loads would be permission nobody asked for.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  esbuild: true
  koffi: false
  node-pty: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-api-remotes@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-layout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar-right@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.2'
  - '@deepseek-ai/dsh-deque@0.2.1-rc.2'
  - '@deepseek-ai/dsh-host-webserver@0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.2'
